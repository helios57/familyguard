# The secret contract, and a template for satisfying it badly.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# DO NOT APPLY THIS FILE. DO NOT PUT REAL VALUES IN IT AND COMMIT IT.
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Everything else in this directory depends on exactly one thing: a Secret named
# `familyguard-secret`, in the `familyguard` namespace, carrying these five keys.
#
#   DATABASE_URL          postgres DSN, including the password. Composed HERE rather than assembled
#                         in the Deployment — see the note below, it is the whole reason this is a
#                         five-key secret and not a four-key one.
#   SESSION_SIGNING_KEY   HMAC key for parent session cookies. `openssl rand -base64 48`. Never a
#                         passphrase: the server refuses to start below 32 bytes.
#   OAUTH_CLIENT_ID       Google OAuth client id. Not secret, but it belongs here so that the id and
#                         the secret cannot drift apart across a rotation.
#   OAUTH_CLIENT_SECRET   Google OAuth client secret. Without it the console shows a sign-in button
#                         that can never complete, so the server refuses to start instead.
#   POSTGRES_PASSWORD     the same password as in DATABASE_URL, read by the postgres pod itself.
#
# HOW you produce that Secret is yours. The manifests here name it and nothing more, which is what
# makes them portable: a sealed-secret, an External Secrets `ExternalSecret`, an Infisical
# `InfisicalSecret`, a Vault agent, or `kubectl create secret generic` on a machine that is not
# this repository — all of them satisfy the same contract. The deployment this project actually
# runs uses an operator that materialises it from a secret manager, and that CR lives in a private
# repository because it names a private host and project.
#
# Two properties are worth keeping whichever mechanism you choose:
#
#   1. DATABASE_URL is composed at the secret, not in the pod spec. Building a DSN from a
#      `valueFrom` password means either a shell in the image to paste it together — and this image
#      deliberately has none — or splitting it into PG* variables the Go code does not read.
#      Composing it here is the only version where the password never appears in a manifest, in a
#      pod spec, or in `kubectl describe`.
#
#   2. Rotation must restart the pods. A pod that keeps the old SESSION_SIGNING_KEY in memory goes
#      on accepting cookies you believe you revoked, and a postgres holding the old password will
#      refuse the server's new DSN. The Deployments carry `reloader.stakater.com/auto: "true"` for
#      this; if you do not run Stakater Reloader, replace that annotation with whatever your cluster
#      uses, or accept that rotation is a manual `rollout restart`. A secrets operator updating the
#      Secret does NOT by itself restart anything.
apiVersion: v1
kind: Secret
metadata:
  name: familyguard-secret
  namespace: familyguard
type: Opaque
stringData:
  DATABASE_URL: "postgres://familyguard:REPLACE_ME@familyguard-db:5432/familyguard?sslmode=disable"
  SESSION_SIGNING_KEY: "REPLACE_ME_openssl_rand_base64_48"
  OAUTH_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  OAUTH_CLIENT_SECRET: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
